name: Data relay

on:
  pull_request:
    paths: ['data-relay/**', '.github/workflows/data-relay.yml', 'LICENSE', 'NOTICE', 'TRADEMARKS.md']
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths: ['data-relay/**', '.github/workflows/data-relay.yml', 'LICENSE', 'NOTICE', 'TRADEMARKS.md']

permissions:
  contents: read

concurrency:
  group: data-relay-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  GOWORK: 'off'

jobs:
  test-package:
    name: Test and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: data-relay/go.mod
          cache-dependency-path: |
            data-relay/go.sum
            data-relay/compat/harness/go.sum
      - name: Go tests
        run: |
          unset GOROOT
          go -C data-relay test -mod=readonly ./...
      - name: Package and check binaries
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bash data-relay/scripts/package-linux.sh "$ARCH"
          bash data-relay/scripts/package-linux.sh "$ARCH" --harness-bridge
          verify_package() (
            cd ".runtime/$1/linux-$ARCH"
            sha256sum --check "SHA256SUMS-relay-linux-$ARCH"
            stage=$(mktemp -d "$RUNNER_TEMP/relay-XXXXXX")
            trap 'rm -rf -- "$stage"' EXIT
            tar -xzf "sailry-relay-linux-$ARCH.tar.gz" -C "$stage"
            for member in LICENSE NOTICE TRADEMARKS.md licenses/go-LICENSE licenses/go-PATENTS licenses/go-modules.json; do
              test -s "$stage/$member"
            done
            version=$("$stage/sailry-relay" --version)
            if [[ -n "$2" && "$version" != "Sailry Relay $2" ]]; then
              echo "Expected $1 $2, got $version" >&2
              exit 1
            fi
            printf '%s\n' "$version"
          )
          expected_version=
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then expected_version=${GITHUB_REF_NAME#v}; fi
          verify_package relay "$expected_version"
          verify_package relay-bridge 0.2.8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-relay-linux-${{ matrix.arch }}
          path: .runtime/relay/linux-${{ matrix.arch }}/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: data-relay-linux-*
          path: assets
          merge-multiple: true
      - name: Draft release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=()
          for arch in amd64 arm64; do
            archive="sailry-relay-linux-$arch.tar.gz"
            checksum="SHA256SUMS-relay-linux-$arch"
            sha256sum "$archive" | cmp - "$checksum"
            files+=("$archive" "$checksum")
          done
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --generate-notes --title "Sailry Relay $tag"
          fi
          release=$(gh release view "$tag" --json databaseId,isDraft)
          existing=$RUNNER_TEMP/relay-assets.tsv
          gh api --paginate "repos/$GH_REPO/releases/$(jq -r .databaseId <<<"$release")/assets" \
            --jq '.[] | [.name, .state, (.digest // "")] | @tsv' > "$existing"
          upload=()
          for file in "${files[@]}"; do
            row=$(awk -F '\t' -v name="$file" '$1 == name' "$existing")
            if [[ -z "$row" ]]; then
              upload+=("$file")
              continue
            fi
            sum=$(sha256sum "$file")
            expected=$(printf '%s\tuploaded\tsha256:%s' "$file" "${sum%% *}")
            [[ "$row" == "$expected" ]] || { echo "$file already exists with other content" >&2; exit 1; }
          done
          if (( ${#upload[@]} > 0 )); then
            [[ "$(jq -r .isDraft <<<"$release")" == true ]] || { echo "$tag is already published and missing assets" >&2; exit 1; }
            gh release upload "$tag" "${upload[@]}"
          fi
